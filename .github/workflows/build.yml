name: build (matrix)

# Single canonical CI gate. Per-platform visibility (badges, at-a-glance
# pass/fail in the Actions tab) is provided by the small status-*.yml
# workflows triggered by workflow_run on this workflow's completion.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target.tfm }} (${{ matrix.configuration }}) on ${{ matrix.target.os }}
    runs-on: ${{ matrix.target.os }}
    strategy:
      fail-fast: false
      matrix:
        # Two REAL top-level dimensions (configuration × target) so that
        # GitHub Actions produces a true cartesian product. The earlier
        # `configuration: [...]` + `include:` shape collapsed to 2 cells
        # because each include entry added the same key set without varying
        # an existing dimension, so later includes overwrote earlier ones —
        # leaving only the LAST include (iOS) materialized. See
        # MODERNIZATION.md Phase 1c-a follow-up notes.
        configuration: [Debug, Release]
        target:
          # DesktopGL on Linux validates net9.0 cross-platform code.
          - { os: ubuntu-latest, tfm: net9.0, workloads: '' }
          # WindowsDX requires net9.0-windows7.0 which only restores on Windows.
          - { os: windows-latest, tfm: net9.0-windows7.0, workloads: '' }
          # Android workload installs on Linux runners (cheaper than Windows).
          - { os: ubuntu-latest, tfm: net9.0-android35.0, workloads: android }
          # iOS requires a macOS host (Apple toolchain).
          - { os: macos-latest, tfm: net9.0-ios18.0, workloads: ios }

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup Java (Android only)
        if: matrix.target.tfm == 'net9.0-android35.0'
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "17"

      - name: Install .NET workloads
        if: matrix.target.workloads != ''
        run: dotnet workload install ${{ matrix.target.workloads }} --ignore-failed-sources

      # Restore + build per-TFM so non-Windows hosts never evaluate the
      # net9.0-windows7.0 TFM. dotnet restore Cocos2DMono.sln would evaluate
      # every TFM in every project's <TargetFrameworks> and on macOS raise
      # NETSDK1100 ("To build a project targeting Windows on this operating
      # system, set EnableWindowsTargeting=true") when it hit the Windows
      # TFM. -p:TargetFrameworks=<tfm> narrows the project to the single TFM
      # being built. Box2D is restored first so Cocos2DMono's ProjectReference
      # resolves from a populated cache.
      - name: Build Box2D
        run: dotnet build src/Box2D/Box2D.csproj -c ${{ matrix.configuration }} -f ${{ matrix.target.tfm }} -p:TargetFrameworks=${{ matrix.target.tfm }}

      - name: Build Cocos2DMono
        run: dotnet build src/Cocos2DMono/Cocos2DMono.csproj -c ${{ matrix.configuration }} -f ${{ matrix.target.tfm }} -p:TargetFrameworks=${{ matrix.target.tfm }}

      - name: Build IntegrationTests
        run: dotnet build Tests/Cocos2DMono.IntegrationTests/Cocos2DMono.IntegrationTests.csproj -c ${{ matrix.configuration }} -f ${{ matrix.target.tfm }} -p:TargetFrameworks=${{ matrix.target.tfm }}

  pack:
    name: Pack NuGet (preview)
    needs: build
    runs-on: windows-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/modernization/'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Install mobile workloads
        run: dotnet workload install android ios --ignore-failed-sources
      - name: Restore
        run: dotnet restore Cocos2DMono.sln
      - name: Pack Box2D
        run: dotnet pack src/Box2D/Box2D.csproj -c Release --no-restore -o artifacts
      - name: Pack Cocos2DMono
        run: dotnet pack src/Cocos2DMono/Cocos2DMono.csproj -c Release --no-restore -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
